[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspot"
version = "0.1.0"
description = "60-second blind-spot audit for AI-agent oversight stacks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy", "scipy"]

[project.scripts]
blindspot = "blindspot.cli:main"

[tool.setuptools]
packages = ["blindspot"]

[tool.setuptools.package-data]
blindspot = ["incidents/*.json"]
